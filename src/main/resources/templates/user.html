<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>User page</title>

    <!-- Bootstrap 5 -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Наш CSS -->
    <link rel="stylesheet"
          th:href="@{/css/styles.css}">

</head>

<body>


<!-- ================= HEADER ================= -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container-fluid">

        <span class="navbar-brand mb-0">

            <strong th:text="${#authentication.principal.username}">
                user@mail.ru
            </strong>

            <span class="ms-1">
                with roles:
            </span>

            <span th:each="authority : ${#authentication.authorities}"
                  th:text="${authority.authority.replace('ROLE_', '') + ' '}">
            </span>

        </span>


        <!-- Logout -->

        <form th:action="@{/logout}"
              method="post"
              class="mb-0">

            <button type="submit"
                    class="btn btn-link text-light text-decoration-none">

                Logout

            </button>

        </form>

    </div>

</nav>


<!-- ================= MAIN ================= -->

<div class="container-fluid">

    <div class="row">


        <!-- ================= SIDEBAR ================= -->

        <div class="col-md-2 sidebar p-0">

            <div class="nav flex-column">

                <!-- Admin only -->

                <a th:href="@{/admin}"
                   class="nav-link"
                   sec:authorize="hasRole('ADMIN')">

                    Admin

                </a>


                <!-- User -->

                <a th:href="@{/user}"
                   class="nav-link active">

                    User

                </a>

            </div>

        </div>


        <!-- ================= CONTENT ================= -->

        <div class="col-md-10 content">

            <h1 class="page-title">
                User information
            </h1>


            <!-- ================= USER TABLE ================= -->

            <div class="card user-card">

                <div class="card-header">

                    <h5 class="mb-0">
                        About user
                    </h5>

                </div>


                <div class="card-body">

                    <div class="table-responsive">

                        <table class="table table-striped align-middle mb-0">

                            <!-- ================= TABLE HEADER ================= -->

                            <thead>

                            <tr>

                                <th>ID</th>

                                <th>First Name</th>

                                <th>Last Name</th>

                                <th>Age</th>

                                <th>Email</th>

                                <th>Role</th>

                            </tr>

                            </thead>


                            <!-- ================= TABLE BODY ================= -->

                            <tbody>

                            <tr>

                                <!-- ID -->

                                <td th:text="${user.id}">
                                    1
                                </td>


                                <!-- First Name -->

                                <td th:text="${user.firstName}">
                                    Ivan
                                </td>


                                <!-- Last Name -->

                                <td th:text="${user.lastName}">
                                    Ivanov
                                </td>


                                <!-- Age -->

                                <td th:text="${user.age}">
                                    25
                                </td>


                                <!-- Email -->

                                <td th:text="${user.email}">
                                    user@mail.ru
                                </td>


                                <!-- Roles -->

                                <td>

                                    <span th:each="role : ${user.roles}"
                                          class="roles-badge"
                                          th:text="${role + ' '}">
                                        USER
                                    </span>

                                </td>

                            </tr>

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

            <!-- ================= /USER TABLE ================= -->

        </div>

    </div>

</div>

</body>

</html>
