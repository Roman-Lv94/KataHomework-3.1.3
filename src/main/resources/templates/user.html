<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://thymeleaf.org"
      xmlns:sec="http://thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User page</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <!-- Наш CSS -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<!-- HEADER FRAGMENT -->
<div th:replace="~{fragments/header :: header}"></div>

<div class="container-fluid">
    <div class="row">

        <!-- SIDEBAR FRAGMENT -->
        <div th:replace="~{fragments/sidebar :: sidebar('user')}"></div>

        <!-- CONTENT -->
        <div class="col-md-10 content">
            <h1 class="page-title">User information</h1>

            <!-- USER TABLE -->
            <div class="card user-card">
                <div class="card-header">
                    <h5 class="mb-0">About user</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped align-middle mb-0">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>First Name</th>
                                <th>Last Name</th>
                                <th>Age</th>
                                <th>Email</th>
                                <th>Role</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr>
                                <td th:text="${user.id}">1</td>
                                <td th:text="${user.firstName}">Ivan</td>
                                <td th:text="${user.lastName}">Ivanov</td>
                                <td th:text="${user.age}">25</td>
                                <td th:text="${user.email}">user@mail.ru</td>
                                <td>
                                    <span th:each="role : ${user.roles}"
                                          class="roles-badge"
                                          th:text="${role + ' '}">
                                    </span>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
