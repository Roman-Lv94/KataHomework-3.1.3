<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Admin panel</title>

    <!-- Bootstrap -->

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet"
          th:href="@{/css/styles.css}">

</head>

<body>


<!-- ================= HEADER ================= -->

<div th:replace="~{fragments/header :: header}">
</div>


<!-- ================= MAIN ================= -->

<div class="container-fluid">

    <div class="row">


        <!-- ================= SIDEBAR ================= -->

        <div th:replace="~{fragments/sidebar :: sidebar}">
        </div>


        <!-- ================= CONTENT ================= -->

        <div class="col-md-10 content">

            <h1 class="page-title">
                Admin panel
            </h1>


            <!-- ================= TABS ================= -->

            <ul class="nav nav-tabs">

                <li class="nav-item">

                    <a class="nav-link active"
                       th:href="@{/admin}">

                        Users table

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/admin/new}">

                        New User

                    </a>

                </li>

            </ul>


            <!-- ================= USERS TABLE ================= -->

            <div class="card user-card">

                <div class="card-header">

                    <h5 class="mb-0">
                        All users
                    </h5>

                </div>


                <div class="card-body">

                    <div class="table-responsive">

                        <table class="table table-striped align-middle">

                            <thead>

                            <tr>

                                <th>ID</th>

                                <th>First Name</th>

                                <th>Last Name</th>

                                <th>Age</th>

                                <th>Email</th>

                                <th>Role</th>

                                <th class="text-center">
                                    Edit
                                </th>

                                <th class="text-center">
                                    Delete
                                </th>

                            </tr>

                            </thead>


                            <tbody>

                            <tr th:each="user : ${users}">

                                <td th:text="${user.id}">
                                    1
                                </td>

                                <td th:text="${user.firstName}">
                                    Ivan
                                </td>

                                <td th:text="${user.lastName}">
                                    Ivanov
                                </td>

                                <td th:text="${user.age}">
                                    25
                                </td>

                                <td th:text="${user.email}">
                                    admin@mail.ru
                                </td>


                                <!-- Roles -->

                                <td>

                                    <span th:each="role : ${user.roles}"
                                          class="roles-badge me-1"
                                          th:text="${role}">
                                    </span>

                                </td>


                                <!-- Edit -->

                                <td class="text-center">

                                    <button type="button"
                                            class="btn btn-edit px-3"
                                            data-bs-toggle="modal"
                                            th:data-bs-target="'#editModal' + ${user.id}">

                                        Edit

                                    </button>

                                </td>


                                <!-- Delete -->

                                <td class="text-center">

                                    <button type="button"
                                            class="btn btn-danger px-3"
                                            data-bs-toggle="modal"
                                            th:data-bs-target="'#deleteModal' + ${user.id}">

                                        Delete

                                    </button>

                                </td>

                            </tr>

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>


            <!-- ================= EDIT MODALS ================= -->

            <div th:each="user : ${users}">

                <div th:replace="~{fragments/edit-modal :: editModal(user=${user}, allRoles=${allRoles})}">
                </div>

            </div>


            <!-- ================= DELETE MODALS ================= -->

            <div th:each="user : ${users}">

                <div th:replace="~{fragments/delete-modal :: deleteModal(user=${user})}">
                </div>

            </div>

        </div>

    </div>

</div>


<!-- ================= BOOTSTRAP JS ================= -->

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
