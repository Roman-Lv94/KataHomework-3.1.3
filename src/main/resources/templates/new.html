<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New User</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <!-- Наши стили -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<!-- HEADER FRAGMENT -->
<div th:replace="~{fragments/header :: header}"></div>

<div class="container-fluid">
    <div class="row">

        <!-- SIDEBAR FRAGMENT -->
        <div th:replace="~{fragments/sidebar :: sidebar('admin')}"></div>

        <!-- CONTENT -->
        <div class="col-md-10 content">
            <h1 class="page-title">Admin panel</h1>

            <!-- TABS -->
            <ul class="nav nav-tabs">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin}">Users table</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/admin/new}">New User</a>
                </li>
            </ul>

            <!-- CARD FORM -->
            <div class="card user-card">
                <div class="card-header">
                    <h5 class="mb-0">Add new user</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/admin}" th:object="${user}" method="post" class="new-user-form">

                        <div class="form-group">
                            <label class="form-label">First name</label>
                            <input type="text" th:field="*{firstName}" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Last name</label>
                            <input type="text" th:field="*{lastName}" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Age</label>
                            <input type="number" th:field="*{age}" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Email</label>
                            <input type="email" th:field="*{email}" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Password</label>
                            <input type="password" th:field="*{password}" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Role</label>
                            <select class="form-select role-select" th:field="*{roles}" multiple>
                                <option th:each="role : ${allRoles}" th:value="${role.id}" th:text="${role}"></option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-success add-user-button">Add new user</button>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
