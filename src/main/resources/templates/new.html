<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>New User</title>

    <!-- Bootstrap 5 -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Наши стили -->
    <link rel="stylesheet"
          th:href="@{/css/styles.css}">

</head>


<body>

<!-- ========================= -->
<!-- Верхняя панель -->
<!-- ========================= -->

<nav class="navbar navbar-dark bg-dark top-navbar">

    <div class="container-fluid">

        <!-- Информация о пользователе -->

        <span class="navbar-text text-white user-info">

            <strong th:text="${#authentication.name}">
                admin@mail.ru
            </strong>

            <span> with roles: </span>

            <span
                    th:each="authority, iterStat : ${#authentication.authorities}">

                <span th:text="${authority.authority.replace('ROLE_', '')}">
                    ADMIN
                </span>

                <span th:if="${!iterStat.last}">
                    <span> </span>
                </span>

            </span>

        </span>


        <!-- Logout -->

        <form th:action="@{/logout}"
              method="post"
              class="logout-form">

            <button type="submit"
                    class="btn btn-link text-light logout-button">
                Logout
            </button>

        </form>

    </div>

</nav>


<!-- ========================= -->
<!-- Основная часть -->
<!-- ========================= -->

<div class="container-fluid">

    <div class="row">


        <!-- ========================= -->
        <!-- Боковое меню -->
        <!-- ========================= -->

        <div class="col-md-2 sidebar p-0">

            <div class="nav flex-column sidebar-menu">

                <a th:href="@{/admin}"
                   class="nav-link active-sidebar">

                    Admin

                </a>


                <a th:href="@{/user}"
                   class="nav-link">

                    User

                </a>

            </div>

        </div>


        <!-- ========================= -->
        <!-- Контент -->
        <!-- ========================= -->

        <div class="col-md-10 content">


            <!-- Заголовок -->

            <h1 class="page-title">
                Admin panel
            </h1>


            <!-- ========================= -->
            <!-- Вкладки -->
            <!-- ========================= -->

            <ul class="nav nav-tabs">

                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/admin}">

                        Users table

                    </a>

                </li>


                <li class="nav-item">

                    <a class="nav-link active"
                       th:href="@{/admin/new}">

                        New User

                    </a>

                </li>

            </ul>


            <!-- ========================= -->
            <!-- Карточка -->
            <!-- ========================= -->

            <div class="card user-card">


                <!-- Заголовок карточки -->

                <div class="card-header">

                    <h5 class="mb-0">
                        Add new user
                    </h5>

                </div>


                <!-- ========================= -->
                <!-- Форма -->
                <!-- ========================= -->

                <div class="card-body">


                    <form th:action="@{/admin}"
                          th:object="${user}"
                          method="post"
                          class="new-user-form">


                        <!-- First Name -->

                        <div class="form-group">

                            <label class="form-label">
                                First name
                            </label>

                            <input type="text"
                                   th:field="*{firstName}"
                                   class="form-control"
                                   required>

                        </div>


                        <!-- Last Name -->

                        <div class="form-group">

                            <label class="form-label">
                                Last name
                            </label>

                            <input type="text"
                                   th:field="*{lastName}"
                                   class="form-control"
                                   required>

                        </div>


                        <!-- Age -->

                        <div class="form-group">

                            <label class="form-label">
                                Age
                            </label>

                            <input type="number"
                                   th:field="*{age}"
                                   class="form-control"
                                   required>

                        </div>


                        <!-- Email -->

                        <div class="form-group">

                            <label class="form-label">
                                Email
                            </label>

                            <input type="email"
                                   th:field="*{email}"
                                   class="form-control"
                                   required>

                        </div>


                        <!-- Password -->

                        <div class="form-group">

                            <label class="form-label">
                                Password
                            </label>

                            <input type="password"
                                   th:field="*{password}"
                                   class="form-control"
                                   required>

                        </div>


                        <!-- Roles -->

                        <div class="form-group">

                            <label class="form-label">
                                Role
                            </label>

                            <select class="form-select role-select"
                                    th:field="*{roles}"
                                    multiple>

                                <option
                                        th:each="role : ${allRoles}"
                                        th:value="${role.id}"
                                        th:text="${role}">

                                </option>

                            </select>

                        </div>


                        <!-- Кнопка -->

                        <button type="submit"
                                class="btn btn-success add-user-button">

                            Add new user

                        </button>


                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


</body>
</html>
